<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fun Face Finder</title><style>body{margin:0;background:#101827;color:white;font:16px system-ui;text-align:center}header{padding:18px 12px}h1{font-size:25px;margin:5px}p{color:#bdc9d9}.stage{position:relative;width:100%;max-width:700px;margin:auto;background:#05080d;min-height:280px}video{display:block;width:100%;height:auto}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}button{background:#29d17e;color:#092116;border:0;border-radius:14px;padding:15px 20px;margin:8px;font-weight:750;font-size:16px}button:disabled{opacity:.4}.status{padding:12px}small{display:block;padding:15px;color:#b3c0d0;line-height:1.5}</style></head><body><header><h1>😎 Fun Face Finder</h1><p>Live face boxes • On-device • No recording</p></header><div class="stage"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas></div><div class="status" id="status">Tap Start Camera</div><button id="start">Start Camera</button><button id="flip" disabled>Flip Camera</button><small>Works best in Safari on an HTTPS-hosted page. Camera permission is required. Face detection needs a compatible browser and an internet connection to load the detection library initially.</small><script type="module">
const video=document.querySelector('#video'),canvas=document.querySelector('#overlay'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),start=document.querySelector('#start'),flip=document.querySelector('#flip');let stream=null, facing='environment',detector=null,run=false,busy=false;
async function loadDetector(){if(detector)return;status.textContent='Loading face detector…';const lib=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');const vision=await lib.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');detector=await lib.FaceDetector.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',delegate:'CPU'},runningMode:'VIDEO',minDetectionConfidence:0.5});}
async function openCamera(){if(!navigator.mediaDevices?.getUserMedia){status.textContent='Camera requires HTTPS and a supported browser.';return;}run=false;if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();flip.disabled=false;run=true;status.textContent='Looking for faces…';requestAnimationFrame(tick);}catch(e){status.textContent='Camera error: '+e.message;}}
async function tick(){if(!run)return;if(video.readyState>=2&&!busy){busy=true;try{let w=video.videoWidth,h=video.videoHeight;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}const result=detector.detectForVideo(video,performance.now());ctx.clearRect(0,0,w,h);const faces=result.detections||[];ctx.lineWidth=Math.max(3,w/250);ctx.strokeStyle='#29ff83';ctx.font=`bold ${Math.max(18,w/35)}px system-ui`;ctx.fillStyle='#29ff83';for(const d of faces){const b=d.boundingBox;ctx.strokeRect(b.originX,b.originY,b.width,b.height);ctx.fillText('Face found!',b.originX,Math.max(24,b.originY-8));}status.textContent=faces.length?`😎 ${faces.length} face${faces.length===1?'':'s'} found!`:'Looking for faces…';}catch(e){status.textContent='Detection error: '+e.message;run=false;}busy=false;}if(run)requestAnimationFrame(tick);}
start.onclick=async()=>{start.disabled=true;try{await loadDetector();await openCamera();}catch(e){status.textContent='Could not load detector: '+e.message;}finally{start.disabled=false;}};flip.onclick=async()=>{facing=facing==='environment'?'user':'environment';await openCamera();};window.addEventListener('pagehide',()=>{run=false;if(stream)stream.getTracks().forEach(t=>t.stop());});
</script></body></html>
